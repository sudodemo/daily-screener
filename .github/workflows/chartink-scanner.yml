name: Chartink Scanner Bot

on:
  schedule:
    # Runs every 15 minutes during the 9:00 AM IST hour (starting at 9:30 AM IST / 4:30 AM UTC)
    - cron: '30,45 4 * * *'
    # Runs every 15 minutes from 10:00 AM IST to 3:30 PM IST (5:00 AM to 10:00 AM UTC)
    - cron: '0,15,30,45 5-9 * * *'
    # Runs at exactly 3:00 PM and 3:15 PM and 3:30 PM IST (10:00, 10:15, 10:30 UTC)
    - cron: '0,15,30 10 * * *'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.0
        with:
          fetch-depth: 0
      
      - name: Setup Python 3.11
        uses: actions/setup-python@v5.2.0
        with:
          python-version: '3.11'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright requests beautifulsoup4
          playwright install chromium
      
      - name: Run Chartink Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py
      
      - name: Commit and push changes
        if: always()
        run: |
          git config --global user.email "action@github.com"
          git config --global user.name "GitHub Action Bot"
          git add -A
          if git diff --quiet --cached; then
            echo "No changes to commit"
          else
            git commit -m "Update seen_stocks.json - $(date '+%Y-%m-%d %H:%M:%S')"
            git push origin main
          fi
