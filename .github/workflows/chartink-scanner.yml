name: Chartink Scanner Bot

on:
  schedule:
    # Every 5 minutes during market hours (9:15 AM - 3:30 PM IST)
    - cron: '*/5 3-10 * * *'
  
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4.1.7
      
      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5.1.0
        with:
          python-version: '3.11'
          cache: 'pip'
      
      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install chromium
      
      - name: 🤖 Run Chartink Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scanner.py
      
      - name: 💾 Save seen_stocks.json
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add seen_stocks.json || true
          git diff --quiet && git diff --staged --quiet || (git commit -m "Update seen_stocks.json" && git push)
        continue-on-error: true
